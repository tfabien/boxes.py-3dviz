<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boxes.py 3D</title>
<style>
  html,body{margin:0;height:100%;font:13px system-ui,sans-serif;background:#1e2227;color:#ddd}
  #ui{position:fixed;top:0;left:0;bottom:0;width:340px;overflow:auto;background:#000b;padding:8px 12px;box-sizing:border-box}
  h3{margin:12px 0 4px;font-size:13px;color:#e8c27a}
  label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:3px 0}
  label.off{opacity:.45}
  input[type=text],select{width:110px;background:#0006;color:#fff;border:1px solid #666;border-radius:4px;padding:2px 4px;box-sizing:border-box}
  #type{width:100%;font-size:14px;margin:6px 0}
  input[type=text].bad{border-color:#f55}
  #msg{color:#f88;min-height:1.2em}
  a.btn{display:block;text-align:center;background:#e8c27a;color:#000;padding:6px;border-radius:5px;text-decoration:none;margin:8px 0;font-weight:600}
  small{opacity:.7}
  #home{position:fixed;inset:0;overflow:auto;background:#1e2227;z-index:10;padding:18px 28px 40px}
  #home h1{margin:0 0 4px;font-size:22px;color:#e8c27a}
  #home h2{margin:26px 0 10px;font-size:15px;color:#e8c27a;border-bottom:1px solid #444;padding-bottom:4px}
  #home input{width:260px;font-size:14px;padding:5px 8px;margin:8px 0}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
  .card{background:#000a;border:1px solid #3a3f46;border-radius:8px;overflow:hidden;cursor:pointer;transition:transform .12s,border-color .12s}
  .card:hover{transform:translateY(-3px);border-color:#e8c27a}
  .card .im{height:150px;display:flex;align-items:center;justify-content:center;background:#15181c}
  .card img{width:100%;height:100%;object-fit:contain}
  .card .tx{padding:8px 10px}
  .card b{display:block;font-size:13px}
  .card small{display:block;margin-top:2px;font-size:11px}
  #views{position:fixed;top:8px;z-index:5;display:flex;gap:4px;background:#000a;padding:4px;border-radius:6px}
  #views button{background:#2a2f36;color:#e8c27a;border:1px solid #555;border-radius:4px;padding:3px 10px;cursor:pointer}
  #views button.on{background:#e8c27a;color:#000}
  #plan{position:fixed;top:0;bottom:0;background:#fff;z-index:4;overflow:hidden;cursor:grab;touch-action:none}
  #plan img{position:absolute;left:0;top:0;transform-origin:0 0;user-select:none;-webkit-user-drag:none;max-width:none}
  #planmsg{position:absolute;left:10px;bottom:8px;color:#555;font-size:12px;background:#fffd;padding:2px 6px;border-radius:4px}
  .btnhome{display:block;width:100%;background:#2a2f36;color:#e8c27a;border:1px solid #555;border-radius:5px;padding:5px;cursor:pointer;margin-bottom:4px}
</style></head><body>

const RAD = Math.PI/180;

// calcFingers + disposition des doigts (côté positif = doigts, côté négatif = encoches)
function fingerLayout(length, positive, F) {
  let n = Math.floor((length - (F.surr-1)*F.space)/(F.space+F.finger));
  if (n === 0 && length > F.finger + F.t) n = 1;
  if (!F.finger) n = 0;
  let left = length - n*(F.space+F.finger) + F.space;
  if (n <= 0) { n = 0; left = length; }
  let f = F.finger, sp = F.space;
  if (n === 0 && f && left > 0.75*F.t && left > 4*F.play) { n = 1; f = left = left/2; }
  if (!positive) { f += F.play; sp -= F.play; left -= F.play; }
  const out = []; for (let i = 0; i < n; i++) out.push([left/2 + i*(sp+f), f]);
  return out;
}

// Tortue façon Boxes.py (angles en degrés, positif = à gauche)
function turtle(x, y) {
  const T = {x, y, hd:0, pts:[[x, y]]};
  T.edge = len => { T.x += Math.cos(T.hd)*len; T.y += Math.sin(T.hd)*len; T.pts.push([T.x, T.y]); };
  T.corner = (deg, r = 0) => {
    if (!r) { T.hd += deg*RAD; return; }
    const sg = deg > 0 ? 1 : -1, n = Math.max(6, Math.ceil(Math.abs(deg)/3)), da = deg*RAD/n;
    const cx = T.x - sg*r*Math.sin(T.hd), cy = T.y + sg*r*Math.cos(T.hd);
    for (let i = 0; i < n; i++) { const c = Math.cos(da), s = Math.sin(da), dx = T.x-cx, dy = T.y-cy;
      T.x = cx + c*dx - s*dy; T.y = cy + s*dx + c*dy; T.hd += da; T.pts.push([T.x, T.y]); }
  };
  // bord à créneaux : positif = doigts vers l'extérieur, négatif = encoches
  T.fingers = (len, positive, F) => { const h = F.t + F.extra; let pos = 0;
    for (const [o, f] of fingerLayout(len, positive, F)) {
      const s = positive ? -90 : 90;
      T.edge(o - pos); T.corner(s); T.edge(h); T.corner(-s); T.edge(f); T.corner(-s); T.edge(h); T.corner(s); pos = o + f; }
    T.edge(len - pos); };
  return T;
}

// Largeurs d'arête (startWidth / margin) : e = droite, f = doigts, F = encoches, h = droite + trous (rebord)
const edgeW = F => { const ex = F.t + F.extra; return {sw:{e:0, f:0, F:ex, h:F.ew+F.t}, mg:{e:0, f:ex, F:0, h:0}}; };
const edgeSpacing = (F, c) => { const {sw, mg} = edgeW(F); c = /[efFh]/.test(c) ? c : 'e'; return sw[c] + mg[c]; };

// dessine une arête de longueur len ; pour « h », enregistre les trous (rectangles) dans holes
function drawEdge(T, ch, len, F, holes) {
  if (ch === 'f' || ch === 'F') return T.fingers(len, ch === 'f', F);
  if (ch === 'h') {
    const x0 = T.x, y0 = T.y, c = Math.cos(T.hd), s = Math.sin(T.hd), yc = F.ew + F.t/2, hw = (F.w + F.play)/2, p = F.play/2;
    for (const [o, f] of fingerLayout(len, true, F))
      holes.push([[o-p, yc-hw], [o+f+p, yc-hw], [o+f+p, yc+hw], [o-p, yc+hw]].map(([lx, ly]) => [x0 + lx*c - ly*s, y0 + lx*s + ly*c]));
  }
  T.edge(len);
}

// rectangularWall : contour d'un panneau rectangulaire w×h dont l'espace intérieur est [0,w]×[0,h]
// edges = bas, droite, haut, gauche
function rectOutline(w, h, edges, F) {
  edges = edges.replace(/[^efFh]/g, 'e');
  const {sw, mg} = edgeW(F), sp = c => sw[c] + mg[c];
  const T = turtle(sp(edges[3]), mg[edges[0]]), lens = [w, h, w, h], holes = [];
  for (let i = 0; i < 4; i++) {
    const e = edges[i], e2 = edges[(i+1)%4];
    drawEdge(T, e, lens[i], F, holes);
    T.edge(sw[e2]); T.corner(90); T.edge(sw[e]);
  }
  T.pts.pop();
  const sh = p => [p[0] - sp(edges[3]), p[1] - sp(edges[0])];
  return {pts:T.pts.map(sh), holes:holes.map(hh => hh.map(sh))};
}

// trapezoidWall : bas w, hauteur gauche h0, droite h1 ; edges = bas, droite, haut, gauche
function trapOutline(w, h0, h1, edges, F) {
  edges = edges.replace(/[^efFh]/g, 'e');
  const {sw, mg} = edgeW(F), sp = c => sw[c] + mg[c], [e0, e1, e2, e3] = edges;
  const T = turtle(sp(e3), mg[e0]), holes = [], a = Math.atan((h1-h0)/w)/RAD, l = Math.hypot(h0-h1, w);
  drawEdge(T, e0, w, F, holes); T.edge(sw[e1]); T.corner(90); T.edge(sw[e0]);
  drawEdge(T, e1, h1, F, holes); T.corner(90); T.edge(sw[e1]);
  T.corner(a); drawEdge(T, e2, l, F, holes); T.corner(-a);
  T.edge(sw[e3]); T.corner(90);
  drawEdge(T, e3, h0, F, holes); T.edge(sw[e0]); T.corner(90); T.edge(sw[e3]);
  T.pts.pop();
  const sh = p => [p[0] - sp(e3), p[1] - sp(e0)];
  return {pts:T.pts.map(sh), holes:holes.map(hh => hh.map(sh))};
}

// Panneau plat : contour 2D (u,v) extrudé de t. O = origine, U/V = axes ; l'épaisseur part de O selon U×V
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);

function panel(o, t, O, U, V, dir = V3(0,0,0), unfold = null) {

// ---- Paramètres communs ----
function common() {
  const num = k => parseFloat(V[k]);
  const t = num('thickness'), burn = num('burn');

  const F = {t, space:num('FingerJoint_space')*t, finger:num('FingerJoint_finger')*t, surr:num('FingerJoint_surroundingspaces'),

  const vals = [t, burn, F.space, F.finger, F.surr, F.play, F.extra, F.ew, F.w].concat(SCHEMAS[TYPE].groups.some(g => g.items.some(i => i.name === 'Flex_width')) ? [fl.dist, fl.conn, fl.width] : []);

// ---- Boîtes à paroi flexible : contour des plaques (ops) + paroi (segs) ----
// ops : ['f'|'e'|'latch', len] | ['c', deg, r] ; segs : ['F'|'X'|'e'|'L', len] (F = encoches haut+bas, X = fentes, L = loquet)

    }

// Découpes de FlexEdge(x=longueur d'arc, h) → segments [y0,y1] par ligne (position u le long de l'arc)
function flexLines(x, h, {dist, conn, width}, burn) {
  h += 2*burn;

  for (let i = 1; i < lines; i++) {

    if (i % 2) {
      seg.push([0, conn+sh]);
      for (let j = 0; j < Math.floor((sections-1)/2); j++) seg.push([(2*j+1)*sh+(2*j+2)*conn, (2*j+3)*(sh+conn)]);
      if (!(sections % 2)) seg.push([h-sh-conn, h]);
    } else if (sections % 2) {
      seg.push([h, h-conn-sh]);
      for (let j = 0; j < Math.floor((sections-1)/2); j++) seg.push([h-((2*j+1)*sh+(2*j+2)*conn), h-(2*j+3)*(sh+conn)]);
    } else for (let j = 0; j < sections/2; j++) seg.push([h-conn-2*j*(sh+conn), h-2*(j+1)*(sh+conn)]);

}

// ElectronicsBox : 4 parois (trous pour 4 triangles), fond (option : pattes de fixation arrondies), couvercle vissé posé sur les triangles
USED.ElectronicsBox = ['x','y','h','triangle','d1','d2','d3','outsidemounts','holedist'];
NOTES.ElectronicsBox = 'Couvercle affiché dans la cavité (affleurant le haut des parois), sur les 4 triangles. ';
BUILD.ElectronicsBox = function (c) {
  const {t, num, F} = c, ex = t + F.extra, tr = num('triangle'), d1 = num('d1'), d2 = num('d2'), d3 = num('d3'), hd = num('holedist'), trh = tr/3;

// ==== EngravingFrame : cadre pour gravure (facade + plaque arriere + parois) ====
(function () {

(function () {

    const p = F.play/2;
    return [[o-p, b0], [o+f+p, b0], [o+f+p, b1], [o-p, b1]].map(([lx, ly]) => {
      const x = ox + e[0]*lx + nrm[0]*ly, y = oy + e[1]*lx + nrm[1]*ly; return [mapX ? mapX(x) : x, y]; }); });
  const roundedRect = (u0, v0, u1, v1, r) => { const T = turtle(u0 + r, v0), w = u1 - u0, h = v1 - v0;
    T.edge(w - 2*r); T.corner(90, r); T.edge(h - 2*r); T.corner(90, r); T.edge(w - 2*r); T.corner(90, r); T.edge(h - 2*r); T.corner(90, r); return T.pts.slice(0, -1); };

  BUILD.StevensonScreenBox = function (c) {
    const {t, num, F} = c, X = num('x'), Y = num('y'), H = num('h'), th = num('top_slope')*RAD, ang = num('slat_angle'), glued = V.roof_top === 'glued';
    if (![X, Y, H, th, ang, num('slat_overlap'), num('slat_depth'), num('bottom_width')].every(isFinite) || !(X > 0 && Y > 0 && H > 0)) throw 'Dimensions incohérentes';
    const h1 = H + X*Math.sin(th), frontH = h1 - Math.sin(th)*2*t - t, backH = H, minV = 2*t;
    const fs = geom(c, frontH - minV), bs = geom(c, backH - minV);

    for (let i = 0; i < fs.n; i++) side.holes.push(...row(t, i*fs.pitch, [ca, sa], [-sa, ca], t/2 - hw, t/2 + hw, fs.depth, F, x => X - x));

})();

// ---- Rendu ----
let M = null, parts = [], wallMeshes = [], wallMat = null;
function applyExplode() {
  const e = +V._explode || 0, d = +V._unfold || 0, k = +V._open || 0;
  // boîtes flexibles : le verrou tourne d'abord (40 % de la course, si la boîte en a un), puis la partie flexible de l'avant se déplie
  let kl = k, kd = 0;
  if (M && M.kind === 'flex') { const sh = M.latchShare || 0; kl = sh ? Math.min(1, k/sh) : 0; kd = sh ? Math.max(0, (k - sh)/(1 - sh)) : k; }
  if (M && M.kind === 'flex' && M.doorOp >= 0 && kd !== M._doorBuilt) { M._doorBuilt = kd; buildWall(true); return; }
  for (const p of parts) { p.g.quaternion.identity(); p.g.position.copy(p.dir).multiplyScalar(e);
    if (p.unfold) p.g.position.add(p.unfold(d)); }
  // ouverture : m.openers = [{parts:[panel...], point:V3, axis:V3, angle:deg} (rotation autour d'un axe)
  //                          | {parts:[panel...], slide:V3} (translation de longueur |slide| à k=1)]
  for (const o of (M && M.openers) || []) {
    if (o.slide) { const sh = o.slide.clone().multiplyScalar(kl); o.parts.forEach(p => p.g.position.add(sh)); }
    else { const q = new THREE.Quaternion().setFromAxisAngle(o.axis.clone().normalize(), kl*o.angle*RAD);
      const off = o.point.clone().sub(o.point.clone().applyQuaternion(q));
      o.parts.forEach(p => { p.g.quaternion.premultiply(q); p.g.position.add(off); }); }   // rotation autour de l'axe, puis éclaté en repère monde
  }
  // le verrou suit l'extrémité de la paroi quand la porte se déplie
  if (M && M.latchParts && kd > 0 && !d) {
    const a0 = M.wallAt(M.pivotU), a1 = M.wallAtD(M.pivotU, kd, M.doorOp), qz = new THREE.Quaternion().setFromAxisAngle(V3(0,0,1), a1.hd - a0.hd);
    const pc = V3(a0.x, a0.y, 0), pu = V3(a1.x, a1.y, 0);
    M.latchParts.forEach(p => { p.g.quaternion.premultiply(qz); p.g.position.sub(pc).applyQuaternion(qz).add(pu); });
  }
}

function buildWall(skipCenter) {
  if (!M || M.kind !== 'flex') return;
  const d = +V._unfold || 0, kd = M._doorBuilt || 0, t = M.t, H = M.Hw, total = M.wallLen;
  const L = d > 0 ? M.wallLine(d) : (kd > 0 && M.doorOp >= 0 ? M.wallLine(kd, M.doorOp) : M.wallLine(0));
  wallMeshes.forEach(m => { group.remove(m); m.geometry.dispose(); }); wallMeshes = [];
  const P = (q, w, z) => [q.x + w*Math.sin(q.hd), q.y - w*Math.cos(q.hd), z];
  const ribbon = (pa, pb, v0 = 0, v1 = 1) => {
    const pos = [], uv = [], idx = [];
    L.forEach((q, i) => { pos.push(...pa(q), ...pb(q)); uv.push(q.u/total, v0, q.u/total, v1);
      if (i) { const a = 2*(i-1); idx.push(a, a+2, a+1, a+1, a+2, a+3); } });
    const bg = new THREE.BufferGeometry();
    bg.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); bg.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    bg.setIndex(idx); bg.computeVertexNormals();
    const m = new THREE.Mesh(bg, wallMat); group.add(m); wallMeshes.push(m); };
  for (const w of [0, t]) ribbon(q => P(q, w, 0), q => P(q, w, H));
  ribbon(q => P(q, 0, 0), q => P(q, t, 0), .003, .003); ribbon(q => P(q, 0, H), q => P(q, t, H), .997, .997);
  // contour de la paroi : bords haut et bas des deux faces et extrémités
  const lp = []; const seg = (a, b) => lp.push(...a, ...b);
  for (const w of [0, t]) for (const z of [0, H]) for (let i = 1; i < L.length; i++) seg(P(L[i-1], w, z), P(L[i], w, z));
  for (const q of [L[0], L[L.length-1]]) for (const w of [0, t]) seg(P(q, w, 0), P(q, w, H));
  for (const z of [0, H]) for (const q of [L[0], L[L.length-1]]) seg(P(q, 0, z), P(q, t, z));
  const lg = new THREE.BufferGeometry(); lg.setAttribute('position', new THREE.Float32BufferAttribute(lp, 3));
  const wl = new THREE.LineSegments(lg, lineMat); group.add(wl); wallMeshes.push(wl);
  applyExplode(); if (!skipCenter) recenter();
}

function recenter() {
  group.rotation.set(0, 0, 0); group.position.set(0, 0, 0); group.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(group), c = box.getCenter(new THREE.Vector3()), sz = box.getSize(new THREE.Vector3());
  group.rotation.x = -Math.PI/2;
  group.position.set(-c.x, -c.z, c.y);   // Z des plans -> haut ; (x,y,z) -> (x, z, -y)
  if (!fitted) { const dd = Math.max(sz.x, sz.y, sz.z)*2.2; camera.position.set(dd*.8, dd*.6, dd); fitted = true; }
}

    const {t, Hw, bb} = m, pts = m.outline, uz = V3(0,0,1), ux = V3(1,0,0), uy = V3(0,1,0);

    m.extras.forEach(p => { p.unfold = d => p.dir.clone().multiplyScalar(d*80); parts.push(p); });
    wallMat = new THREE.MeshStandardMaterial({map:m.texture(), alphaTest:.5, side:THREE.DoubleSide, roughness:.8});

// ---- Interface ----
const ui = document.getElementById('ui');

// ---- Vues : 3D, plan 2D (SVG du générateur réel), ou les deux côte à côte ----
let MODE = '3d', PT = {s:1, x:0, y:0, user:false}, planTimer = 0;
const views = document.createElement('div'); views.id = 'views';
for (const [m, lab] of [['3d', '3D'], ['split', '3D | 2D'], ['2d', 'Plan 2D (SVG)']]) {
  const b = document.createElement('button'); b.textContent = lab; b.dataset.m = m; b.onclick = () => setMode(m); views.append(b);
}
document.body.append(views);
const plan = document.createElement('div'); plan.id = 'plan'; plan.style.display = 'none';
plan.innerHTML = '<img id="planimg" alt=""><div id="planmsg"></div>'; document.body.append(plan);
const pimg = plan.querySelector('img'), pmsg = plan.querySelector('#planmsg');
const applyPT = () => { pimg.style.transform = 'translate(' + PT.x + 'px,' + PT.y + 'px) scale(' + PT.s + ')'; };
const fitPlan = () => { if (!pimg.naturalWidth) return; const s = Math.min(plan.clientWidth/pimg.naturalWidth, plan.clientHeight/pimg.naturalHeight)*0.96;
  PT = {s, x:(plan.clientWidth - pimg.naturalWidth*s)/2, y:(plan.clientHeight - pimg.naturalHeight*s)/2, user:false}; applyPT(); };
pimg.onload = () => { pmsg.textContent = ''; if (!PT.user) fitPlan(); };
pimg.onerror = () => { pmsg.textContent = SCHEMAS[TYPE].custom ? 'Plan indisponible : serveur local arrêté ? (lancer_serveur.bat)' : 'Plan indisponible : hors ligne ou paramètres invalides.'; };
plan.addEventListener('wheel', e => { e.preventDefault(); const r = plan.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top, f = e.deltaY < 0 ? 1.15 : 1/1.15;
  PT.x = mx - (mx - PT.x)*f; PT.y = my - (my - PT.y)*f; PT.s *= f; PT.user = true; applyPT(); }, {passive:false});
let drag = null;
plan.onpointerdown = e => { drag = {x:e.clientX - PT.x, y:e.clientY - PT.y}; plan.setPointerCapture(e.pointerId); plan.style.cursor = 'grabbing'; };
plan.onpointermove = e => { if (drag) { PT.x = e.clientX - drag.x; PT.y = e.clientY - drag.y; PT.user = true; applyPT(); } };
plan.onpointerup = () => { drag = null; plan.style.cursor = 'grab'; };
plan.ondblclick = () => { PT.user = false; fitPlan(); };
function planURL() {
  const q = new URLSearchParams();
  for (const g of SCHEMAS[TYPE].groups) for (const i of g.items) q.set(i.name, typeof V[i.name] === 'boolean' ? +V[i.name] : V[i.name]);
  q.set('language', 'fr'); q.set('render', '1'); q.set('format', 'svg');
  return SCHEMAS[TYPE].custom ? LOCAL_SERVER + '/' + SCHEMAS[TYPE].custom + '?' + q : 'https://boxes.hackerspace-bamberg.de/' + TYPE + '?' + q;
}
function refreshPlan(now) {
  clearTimeout(planTimer);
  planTimer = setTimeout(() => { pmsg.textContent = 'Chargement du plan…'; pimg.src = planURL(); }, now ? 0 : 400);
}
function layout() {   // 3D à droite du panneau ; en mode « 3D | 2D » la moitié de la largeur, en mode 2D tout le plan
  const left = ui.style.display === 'none' ? 0 : 340, W = innerWidth - left, H = innerHeight;
  const w3 = MODE === '3d' ? W : MODE === 'split' ? Math.floor(W/2) : 0, cv = renderer.domElement;
  cv.style.cssText = 'position:fixed;top:0;left:' + left + 'px;' + (w3 ? '' : 'display:none');
  if (w3) { renderer.setSize(w3, H); camera.aspect = w3/H; camera.updateProjectionMatrix(); }
  plan.style.display = MODE === '3d' ? 'none' : ''; plan.style.left = (left + w3) + 'px'; plan.style.width = (W - w3) + 'px';
  views.style.left = (left + 10) + 'px';
  for (const b of views.children) b.classList.toggle('on', b.dataset.m === MODE);
  if (MODE !== '3d' && !PT.user) fitPlan();
}
function setMode(m) { MODE = m; layout(); if (m !== '3d') refreshPlan(true); }
function updateLink() {
  const q = new URLSearchParams();
  for (const g of SCHEMAS[TYPE].groups) for (const i of g.items) q.set(i.name, typeof V[i.name] === 'boolean' ? +V[i.name] : V[i.name]);
  q.set('language', 'fr'); q.set('render', '1');
  const gen = document.getElementById('gen');
  gen.onclick = null;
  if (SCHEMAS[TYPE].custom) {   // variante locale : exécutée par boxes_local_server.py (Boxes.py en local)
    const url = LOCAL_SERVER + '/' + SCHEMAS[TYPE].custom + '?' + q;
    gen.href = url; gen.target = '_blank'; gen.textContent = 'Générer (serveur local Boxes.py)';
    gen.onclick = e => { e.preventDefault(); window.open(url, '_blank');
      fetch(LOCAL_SERVER + '/ping', {mode:'no-cors'}).then(() => { document.getElementById('msg').textContent = ''; })
        .catch(() => { document.getElementById('msg').textContent = 'Serveur local arrêté : lancez lancer_serveur.bat puis recliquez sur Générer. '; }); }; }
  else { gen.href = 'https://boxes.hackerspace-bamberg.de/' + TYPE + '?' + q; gen.target = '_blank'; gen.textContent = 'Générer (fichier de découpe réel)'; }
  if (MODE !== '3d') refreshPlan();
}
function drawForm() {
  ui.innerHTML = '';
  const hb = document.createElement('button'); hb.className = 'btnhome'; hb.textContent = '← Accueil (tous les types)'; hb.onclick = showHome; ui.append(hb);
  const sel = document.createElement('select'); sel.id = 'type';
  for (const k of TYPE_ORDER.filter(k => BUILD[k] && SCHEMAS[k])) sel.add(new Option(SCHEMAS[k].title + ' (' + k + ')', k, false, k === TYPE));
  sel.onchange = () => { TYPE = sel.value; fitted = false; resetValues(); drawForm(); updateLink(); build(); assemble(); };
  ui.append(sel);
  const info = document.createElement('div'); info.innerHTML = '<small>' + SCHEMAS[TYPE].desc + '</small><div id="msg"></div>'; ui.append(info);
  const link = document.createElement('a'); link.className = 'btn'; link.id = 'gen'; link.target = '_blank';
  link.textContent = 'Générer (fichier de découpe réel)'; ui.append(link);
  const small = document.createElement('small');
  small.textContent = 'Grisé = sans effet sur la 3D. ' + (NOTES[TYPE] || '') + 'Styles de créneaux non rectangulaires : approximés en rectangulaire.'; ui.append(small);
  const used = new Set([...USED_COMMON, ...USED[TYPE]]);
  for (const g of SCHEMAS[TYPE].groups) {
    const h3 = document.createElement('h3'), box = document.createElement('div');
    const collapsed = /assemblages|flexibilit/i.test(g.title);   // repliés par défaut
    box.hidden = collapsed; h3.textContent = (collapsed ? '▸ ' : '▾ ') + g.title; h3.style.cursor = 'pointer';
    h3.onclick = () => { box.hidden = !box.hidden; h3.textContent = (box.hidden ? '▸ ' : '▾ ') + g.title; };
    ui.append(h3, box);
    for (const it of g.items) {
      const l = document.createElement('label'); l.title = it.desc; if (!used.has(it.name)) l.className = 'off';
      let el;
      if (it.type === 'select') { el = document.createElement('select');
        for (const [v, tx] of it.options) el.add(new Option(tx, v, false, v === V[it.name]));
        el.onchange = () => { V[it.name] = el.value; updateLink(); build(); };
      } else if (it.type === 'bool') { el = document.createElement('input'); el.type = 'checkbox'; el.checked = V[it.name];
        el.onchange = () => { V[it.name] = el.checked; updateLink(); build(); };
      } else { el = document.createElement('input'); el.type = 'text'; el.value = V[it.name];
        el.oninput = () => { V[it.name] = el.value; el.classList.toggle('bad', !isFinite(parseFloat(el.value))); updateLink(); build(); }; }
      l.append(it.label, el); box.append(l);
    }
  }
  const row = (id, txt, max, step, fn) => { const l = document.createElement('label'); l.id = id;
    l.innerHTML = '<span>' + txt + '</span><input type="range" min="0" max="' + max + '" step="' + step + '" value="' + (V[fn.key] || 0) + '" style="width:120px">';
    l.lastChild.oninput = e => { V[fn.key] = e.target.value; fn(); }; ui.append(l); };
  const tog = document.createElement('label'); tog.innerHTML = '<span>Rotation auto</span><input type="checkbox" ' + (controls.autoRotate ? 'checked' : '') + '>';
  tog.lastChild.onchange = e => controls.autoRotate = e.target.checked; ui.append(tog);
  const ex = () => applyExplode(); ex.key = '_explode'; row('explodeRow', 'Éclaté (panneaux)', 80, 1, ex);
  const un = () => { buildWall(); }; un.key = '_unfold'; row('unfoldRow', 'Déplié (paroi flexible)', 1, 0.01, un);
  const op = () => applyExplode(); op.key = '_open'; row('openRow', 'Ouverture', 1, 0.01, op);
  document.getElementById('openRow').style.display = M && M.openers && M.openers.length ? '' : 'none';
}
function resetValues() {
  V = {};
  for (const g of SCHEMAS[TYPE].groups) for (const i of g.items) V[i.name] = i.default;
  V._explode = 0; V._unfold = 0; V._open = 0;
}

// animation d'arrivée : de l'éclaté (80) jusqu'à 0
let anim = 0;
function assemble() {
  cancelAnimationFrame(anim);
  const t0 = performance.now(), from = 80, dur = 1100;
  const step = now => {
    const k = Math.min(1, (now - t0)/dur), e = from*Math.pow(1 - k, 3);   // ease-out cubique
    V._explode = e; V._unfold = 0; V._open = 0; applyExplode();
    const sl = document.querySelector('#explodeRow input'); if (sl) sl.value = e;
    const un = document.querySelector('#unfoldRow input'); if (un) un.value = 0;
    const opn = document.querySelector('#openRow input'); if (opn) opn.value = 0;
    if (k < 1) anim = requestAnimationFrame(step); else { V._explode = 0; applyExplode(); if (sl) sl.value = 0; }
  };
  anim = requestAnimationFrame(step);
}
// ---- Page d'accueil : un visuel (rendu 3D) par type, calculé au premier affichage puis mis en cache ----
const THUMB_VER = 'v4';
const FLEXCAT = k => k.startsWith('FlexBox') || k === 'ShutterBox';   // rubrique « pli flexible »
const home = document.createElement('div'); home.id = 'home'; home.hidden = true; document.body.append(home);
let thumbsDone = false;
function openType(k) {
  TYPE = k; fitted = false; resetValues(); drawForm(); updateLink(); build(); assemble(); home.hidden = true;
}
function showHome() {
  cancelAnimationFrame(anim); home.hidden = false;
  if (home.firstChild) return;
  const types = TYPE_ORDER.filter(k => BUILD[k] && SCHEMAS[k]);
  home.innerHTML = '<h1>Boxes.py — visualiseur 3D</h1><small>' + types.length + ' types de boîtes. Choisissez-en une pour la voir assemblée, éclatée et paramétrable (mêmes réglages que le générateur).</small><br><input id="q" placeholder="Rechercher…" type="text">';
  const imgs = {}, cards = [];
  const section = (title, list) => {
    const h2 = document.createElement('h2'); h2.textContent = title + ' (' + list.length + ')'; home.append(h2);
    const g = document.createElement('div'); g.className = 'grid'; home.append(g);
    for (const k of list) {
      const c = document.createElement('div'); c.className = 'card'; c.onclick = () => openType(k);
      c.innerHTML = '<div class="im"><img alt=""></div><div class="tx"><b></b><small></small></div>';
      c.querySelector('b').textContent = SCHEMAS[k].title; c.querySelector('small').textContent = k + ' — ' + SCHEMAS[k].desc;
      imgs[k] = c.querySelector('img'); c.dataset.s = (SCHEMAS[k].title + ' ' + k + ' ' + SCHEMAS[k].desc).toLowerCase(); g.append(c); cards.push(c);
    }
  };
  section('Boîtes', types.filter(k => !FLEXCAT(k)));
  section('Boîtes avec un pli flexible', types.filter(FLEXCAT));
  home.querySelector('#q').oninput = e => { const q = e.target.value.toLowerCase(); cards.forEach(c => c.style.display = c.dataset.s.includes(q) ? '' : 'none'); };
  // vignettes : cache localStorage, sinon rendu hors écran (240×180) un type par tâche
  const cache = (() => { try { return JSON.parse(localStorage.getItem('boxes3d_thumbs_' + THUMB_VER)) || {}; } catch (e) { return {}; } })();
  const todo = types.filter(k => cache[k] ? (imgs[k].src = cache[k], false) : true);
  const save = () => { try { localStorage.setItem('boxes3d_thumbs_' + THUMB_VER, JSON.stringify(cache)); } catch (e) {} };
  const step = () => {
    const k = todo.shift();
    if (!k) { save(); layout(); return; }
    try {
      TYPE = k; fitted = false; resetValues(); build(); fitted = false; recenter();   // recentre + cadre la caméra sur la boîte
      renderer.setSize(240, 180); camera.aspect = 240/180; camera.updateProjectionMatrix();
      renderer.render(scene, camera);
      if (!step.warm) { step.warm = 1; todo.unshift(k); } else   // 1er rendu = échauffement (caméra pas encore calée), refait
      cache[k] = imgs[k].src = renderer.domElement.toDataURL('image/jpeg', 0.8);
    } catch (e) {}
    setTimeout(step, 0);
  };
  step();
}
// Deep links : #Type&mode=3d|split|2d&explode=40&unfold=1&open=0.5&ui=0&rotate=0&view=iso|top|front|side&p_<parametre>=valeur
const HASH = location.hash.slice(1).split('&'), HOPT = Object.fromEntries(HASH.slice(1).map(q => q.split('=')));
if (BUILD[HASH[0]]) {
  TYPE = HASH[0]; fitted = false; resetValues();
  for (const [k, v] of Object.entries(HOPT)) if (k.startsWith('p_')) { const n = k.slice(2); V[n] = typeof V[n] === 'boolean' ? (v === '1' || v === 'true') : decodeURIComponent(v); }
  const still = 'explode' in HOPT || 'unfold' in HOPT || 'open' in HOPT;
  if ('explode' in HOPT) V._explode = +HOPT.explode; if ('unfold' in HOPT) V._unfold = +HOPT.unfold; if ('open' in HOPT) V._open = +HOPT.open;
  drawForm(); updateLink(); build(); if (!still) assemble(); else applyExplode();
  if (HOPT.rotate === '0') { controls.autoRotate = false; const rl = [...ui.querySelectorAll('label')].find(l => /Rotation auto/.test(l.textContent)); if (rl) rl.querySelector('input').checked = false; }
  if (HOPT.ui === '0') ui.style.display = 'none';
  if (HOPT.mode) { MODE = HOPT.mode; refreshPlan(true); }
  if (HOPT.view) { const d = {iso:[.8,.6,1], top:[0,1,.001], front:[0,.2,1], side:[1,.2,0]}[HOPT.view]; if (d) { const n = Math.hypot(...d), r = camera.position.length(); camera.position.set(d[0]/n*r, d[1]/n*r, d[2]/n*r); controls.update(); } }
}   // #NomDuType : ouvre directement un type
else { resetValues(); drawForm(); updateLink(); build(); showHome(); }
addEventListener('resize', layout);
layout();
(function loop(){ requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();
</script></body></html>
