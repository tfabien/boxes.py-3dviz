<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boxes.py 3D</title>
<style>
  html,body{margin:0;height:100%;font:13px system-ui,sans-serif;background:#1e2227;color:#ddd}
  #ui{position:fixed;top:0;left:0;bottom:0;width:340px;overflow:auto;background:#000b;padding:8px 12px;box-sizing:border-box}
  h3{margin:12px 0 4px;font-size:13px;color:#e8c27a}
  label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:3px 0}
  label.off{opacity:.45}
  input[type=text],select{width:110px;background:#0006;color:#fff;border:1px solid #666;border-radius:4px;padding:2px 4px;box-sizing:border-box}
  #type{width:100%;font-size:14px;margin:6px 0}
  input[type=text].bad{border-color:#f55}
  #msg{color:#f88;min-height:1.2em}
  a.btn{display:block;text-align:center;background:#e8c27a;color:#000;padding:6px;border-radius:5px;text-decoration:none;margin:8px 0;font-weight:600}
  small{opacity:.7}
  #home{position:fixed;inset:0;overflow:auto;background:#1e2227;z-index:10;padding:18px 28px 40px}
  #home h1{margin:0 0 4px;font-size:22px;color:#e8c27a}
  #home h2{margin:26px 0 10px;font-size:15px;color:#e8c27a;border-bottom:1px solid #444;padding-bottom:4px}
  #home input{width:260px;font-size:14px;padding:5px 8px;margin:8px 0}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
  .card{background:#000a;border:1px solid #3a3f46;border-radius:8px;overflow:hidden;cursor:pointer;transition:transform .12s,border-color .12s}
  .card:hover{transform:translateY(-3px);border-color:#e8c27a}
  .card .im{height:150px;display:flex;align-items:center;justify-content:center;background:#15181c}
  .card img{width:100%;height:100%;object-fit:contain}
  .card .tx{padding:8px 10px}
  .card b{display:block;font-size:13px}
  .card small{display:block;margin-top:2px;font-size:11px}
  #views{position:fixed;top:8px;z-index:5;display:flex;gap:4px;background:#000a;padding:4px;border-radius:6px}
  #views button{background:#2a2f36;color:#e8c27a;border:1px solid #555;border-radius:4px;padding:3px 10px;cursor:pointer}
  #views button.on{background:#e8c27a;color:#000}
  #plan{position:fixed;top:0;bottom:0;background:#fff;z-index:4;overflow:hidden;cursor:grab;touch-action:none}
  #plan img{position:absolute;left:0;top:0;transform-origin:0 0;user-select:none;-webkit-user-drag:none;max-width:none}
  #planmsg{position:absolute;left:10px;bottom:8px;color:#555;font-size:12px;background:#fffd;padding:2px 6px;border-radius:4px}
  .homelang{position:absolute;right:28px;top:18px;width:auto !important}
  #ui select.lang{width:100%;margin:2px 0 4px}
  .btnhome{display:block;width:100%;background:#2a2f36;color:#e8c27a;border:1px solid #555;border-radius:5px;padding:5px;cursor:pointer;margin-bottom:4px}
</style></head><body>
<div id="ui"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// Parameter schemas (names, types, defaults, choices) extracted from the Boxes.py web forms (see tools/extract_schemas.py);
// TEXTS holds the labels / descriptions of every language
const SCHEMAS = /*SCHEMAS*/null;
const TEXTS = /*TEXTS*/null;
const LOCAL_SERVER = 'http://127.0.0.1:8777';   // boxes_local_server.py
// Parameters that influence the 3D model, besides these (the others are greyed out: they only matter for the cut file)
const USED_COMMON = ['thickness','burn','FingerJoint_surroundingspaces','FingerJoint_extra_length','FingerJoint_finger','FingerJoint_play','FingerJoint_space','outside'];
// Per-generator data, injected by tools/build.py from generators/<Name>/generator.json
const USED = /*USED*/{};          // parameters that influence the 3D model
const NOTES = /*NOTES*/{};        // limitations shown under the parameter list
const SECTION = /*SECTION*/{};    // home page section: 'boxes' or 'flex'
const TYPE_ORDER = /*ORDER*/[];   // display order
let TYPE = 'FlexBox5', V = {}, WARN = '';
// ---- i18n core: every message is written in English in the code and translated through MSG[lang][english text] ----
let LANG = 'en', WARNS = [];
const MSG = /*MSG*/{};
const fmt = (s, args) => s.replace(/\{(\d+)\}/g, (m, i) => (args && args[i] !== undefined ? args[i] : m));
const tr = (msg, args) => fmt((MSG[LANG] || {})[msg.trim()] || msg, args);   // table keys are trimmed English texts
function warn(msg, ...args) { WARNS.push({msg, args}); }          // notice shown in red under the title: warn(message, ...values) where {0}, {1} in the message are replaced by the values
function fail(msg, ...args) { throw {msg, args}; }                // invalid parameters: fail('Dimensions are inconsistent')
const warnText = () => WARNS.map(w => tr(w.msg, w.args)).join(' ') + (WARN ? ' ' + WARN : '');
const errText = e => e && e.msg ? tr(e.msg, e.args) : tr(String(e));

// ---- Languages: the ones of the Boxes.py web site; default = browser language, English when unknown ----
const LANGS = {en:'English', de:'Deutsch', es:'Español', fr:'Français', pt_BR:'Português (Brasil)', zh_CN:'简体中文'};
function detectLang() {
  try { const s = localStorage.getItem('boxes3d_lang'); if (s in LANGS) return s; } catch (e) {}   // explicit choice wins
  for (const l of (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ''])) {
    const n = l.replace('-', '_'), p = n.split('_')[0].toLowerCase();
    if (n in LANGS) return n;
    if (p === 'pt') return 'pt_BR';
    if (p === 'zh' && !/TW|HK|MO|Hant/i.test(l)) return 'zh_CN';
    if (p in LANGS) return p;
  }
  return 'en';
}
LANG = detectLang();
// localized view of a generator schema: title, description, group titles, labels, help texts and choice labels in the current language
function LS(k) {
  const b = SCHEMAS[k], x = LANG !== 'en' && TEXTS[LANG] && TEXTS[LANG][k];
  if (!x) return b;
  return {...b, title:x.title || b.title, desc:x.desc || b.desc, groups:b.groups.map((g, i) => ({...g, title:x.groups[i] || g.title,
    items:g.items.map(it => { const tx = x.items[it.name]; if (!tx) return it;
      return {...it, label:tx.l || it.label, desc:tx.d || it.desc, options:it.options && it.options.map(([v, lab]) => [v, (tx.o && tx.o[v]) || lab])}; })}))};
}
function langSelect() {
  const s = document.createElement('select'); s.className = 'lang'; s.title = tr('Language');
  for (const k in LANGS) s.add(new Option(LANGS[k], k, false, k === LANG));
  s.onchange = () => setLang(s.value);
  return s;
}

// ---- Scene ----
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x1e2227);
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 1, 8000);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight); document.body.appendChild(renderer.domElement);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.autoRotate = true; controls.autoRotateSpeed = 1.5;
scene.add(new THREE.AmbientLight(0xffffff, .3)); scene.add(new THREE.HemisphereLight(0xffffff, 0x556070, .25));
const sun = new THREE.DirectionalLight(0xffffff, .55); sun.position.set(200,300,150); scene.add(sun);
const sun2 = new THREE.DirectionalLight(0xffffff, .3); sun2.position.set(-250,120,-200); scene.add(sun2);
const group = new THREE.Group(); scene.add(group);
const matPlate = new THREE.MeshStandardMaterial({color:0xc29557, roughness:.8});
let fitted = false;

// ---- Geometry helpers (ports of Boxes.py) ----
const RAD = Math.PI/180;

// calcFingers + finger layout (positive side = fingers, negative side = notches)
function fingerLayout(length, positive, F) {
  let n = Math.floor((length - (F.surr-1)*F.space)/(F.space+F.finger));
  if (n === 0 && length > F.finger + F.t) n = 1;
  if (!F.finger) n = 0;
  let left = length - n*(F.space+F.finger) + F.space;
  if (n <= 0) { n = 0; left = length; }
  let f = F.finger, sp = F.space;
  if (n === 0 && f && left > 0.75*F.t && left > 4*F.play) { n = 1; f = left = left/2; }
  if (!positive) { f += F.play; sp -= F.play; left -= F.play; }
  const out = []; for (let i = 0; i < n; i++) out.push([left/2 + i*(sp+f), f]);
  return out;
}

// Boxes.py style turtle (angles in degrees, positive = left)
function turtle(x, y) {
  const T = {x, y, hd:0, pts:[[x, y]]};
  T.edge = len => { T.x += Math.cos(T.hd)*len; T.y += Math.sin(T.hd)*len; T.pts.push([T.x, T.y]); };
  T.corner = (deg, r = 0) => {
    if (!r) { T.hd += deg*RAD; return; }
    const sg = deg > 0 ? 1 : -1, n = Math.max(6, Math.ceil(Math.abs(deg)/3)), da = deg*RAD/n;
    const cx = T.x - sg*r*Math.sin(T.hd), cy = T.y + sg*r*Math.cos(T.hd);
    for (let i = 0; i < n; i++) { const c = Math.cos(da), s = Math.sin(da), dx = T.x-cx, dy = T.y-cy;
      T.x = cx + c*dx - s*dy; T.y = cy + s*dx + c*dy; T.hd += da; T.pts.push([T.x, T.y]); }
  };
  // finger edge: positive = fingers pointing outwards, negative = notches
  T.fingers = (len, positive, F) => { const h = F.t + F.extra; let pos = 0;
    for (const [o, f] of fingerLayout(len, positive, F)) {
      const s = positive ? -90 : 90;
      T.edge(o - pos); T.corner(s); T.edge(h); T.corner(-s); T.edge(f); T.corner(-s); T.edge(h); T.corner(s); pos = o + f; }
    T.edge(len - pos); };
  return T;
}

// Edge widths (startWidth / margin): e = plain, f = fingers, F = notches, h = plain + finger holes (rim)
const edgeW = F => { const ex = F.t + F.extra; return {sw:{e:0, f:0, F:ex, h:F.ew+F.t}, mg:{e:0, f:ex, F:0, h:0}}; };
const edgeSpacing = (F, c) => { const {sw, mg} = edgeW(F); c = /[efFh]/.test(c) ? c : 'e'; return sw[c] + mg[c]; };

// draws an edge of length len; for 'h' the holes (rectangles) are recorded in holes
function drawEdge(T, ch, len, F, holes) {
  if (ch === 'f' || ch === 'F') return T.fingers(len, ch === 'f', F);
  if (ch === 'h') {
    const x0 = T.x, y0 = T.y, c = Math.cos(T.hd), s = Math.sin(T.hd), yc = F.ew + F.t/2, hw = (F.w + F.play)/2, p = F.play/2;
    for (const [o, f] of fingerLayout(len, true, F))
      holes.push([[o-p, yc-hw], [o+f+p, yc-hw], [o+f+p, yc+hw], [o-p, yc+hw]].map(([lx, ly]) => [x0 + lx*c - ly*s, y0 + lx*s + ly*c]));
  }
  T.edge(len);
}

// rectangularWall: outline of a w×h rectangular panel whose inner space is [0,w]×[0,h]
// edges = bottom, right, top, left
function rectOutline(w, h, edges, F) {
  edges = edges.replace(/[^efFh]/g, 'e');
  const {sw, mg} = edgeW(F), sp = c => sw[c] + mg[c];
  const T = turtle(sp(edges[3]), mg[edges[0]]), lens = [w, h, w, h], holes = [];
  for (let i = 0; i < 4; i++) {
    const e = edges[i], e2 = edges[(i+1)%4];
    drawEdge(T, e, lens[i], F, holes);
    T.edge(sw[e2]); T.corner(90); T.edge(sw[e]);
  }
  T.pts.pop();
  const sh = p => [p[0] - sp(edges[3]), p[1] - sp(edges[0])];
  return {pts:T.pts.map(sh), holes:holes.map(hh => hh.map(sh))};
}

// trapezoidWall: bottom w, left height h0, right height h1; edges = bottom, right, top, left
function trapOutline(w, h0, h1, edges, F) {
  edges = edges.replace(/[^efFh]/g, 'e');
  const {sw, mg} = edgeW(F), sp = c => sw[c] + mg[c], [e0, e1, e2, e3] = edges;
  const T = turtle(sp(e3), mg[e0]), holes = [], a = Math.atan((h1-h0)/w)/RAD, l = Math.hypot(h0-h1, w);
  drawEdge(T, e0, w, F, holes); T.edge(sw[e1]); T.corner(90); T.edge(sw[e0]);
  drawEdge(T, e1, h1, F, holes); T.corner(90); T.edge(sw[e1]);
  T.corner(a); drawEdge(T, e2, l, F, holes); T.corner(-a);
  T.edge(sw[e3]); T.corner(90);
  drawEdge(T, e3, h0, F, holes); T.edge(sw[e0]); T.corner(90); T.edge(sw[e3]);
  T.pts.pop();
  const sh = p => [p[0] - sp(e3), p[1] - sp(e0)];
  return {pts:T.pts.map(sh), holes:holes.map(hh => hh.map(sh))};
}

// Flat panel: 2D outline (u,v) extruded by t. O = origin, U/V = axes; the thickness runs from O along U×V
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const lineMat = new THREE.LineBasicMaterial({color:0x3b2a12});
let panelCount = 0;
function panel(o, t, O, U, V, dir = V3(0,0,0), unfold = null) {
  const pts = o.pts || o, v2 = p => new THREE.Vector2(p[0], p[1]), shape = new THREE.Shape(pts.map(v2));
  (o.holes || []).forEach(hh => shape.holes.push(new THREE.Path(hh.map(v2))));
  const geo = new THREE.ExtrudeGeometry(shape, {depth:t, bevelEnabled:false});
  // every piece gets a slightly different shade and a dark outline so that pieces stay distinguishable
  const mat = new THREE.MeshStandardMaterial({color:new THREE.Color(0xc29557).offsetHSL(0, 0, ((panelCount++ % 5) - 2)*0.03), roughness:.85, polygonOffset:true, polygonOffsetFactor:1, polygonOffsetUnits:1});
  const mesh = new THREE.Mesh(geo, mat), W = new THREE.Vector3().crossVectors(U, V);
  mesh.matrixAutoUpdate = false; mesh.matrix.makeBasis(U, V, W).setPosition(O);
  const edges = new THREE.LineSegments(new THREE.EdgesGeometry(geo, 25), lineMat);
  edges.matrixAutoUpdate = false; edges.matrix.copy(mesh.matrix);
  const g = new THREE.Group(); g.add(mesh, edges);
  return {g, dir, unfold, pts};
}

// ---- Common parameters ----
function common() {
  const num = k => parseFloat(V[k]);
  const t = num('thickness'), burn = num('burn');
  const fl = {dist:num('Flex_distance')*t, conn:num('Flex_connection')*t, width:num('Flex_width')*t};
  const F = {t, space:num('FingerJoint_space')*t, finger:num('FingerJoint_finger')*t, surr:num('FingerJoint_surroundingspaces'),
             play:num('FingerJoint_play')*t, extra:num('FingerJoint_extra_length')*t,
             ew:num('FingerJoint_edge_width')*t, w:num('FingerJoint_width')*t};
  const vals = [t, burn, F.space, F.finger, F.surr, F.play, F.extra, F.ew, F.w].concat(SCHEMAS[TYPE].groups.some(g => g.items.some(i => i.name === 'Flex_width')) ? [fl.dist, fl.conn, fl.width] : []);
  if (vals.some(v => !isFinite(v))) fail('Invalid value');
  if (t <= 0) fail('Thickness must be > 0');
  if (Math.abs(F.space + F.finger) < 0.1) fail('FingerJoint: space + finger must not be close to zero');
  if (V.Flex_distance !== undefined) {
    if (fl.dist < 0.01) fail('Flex: distance must be > 0.01 mm');
    if (fl.width < 0.1) fail('Flex: width must be > 0.1 mm'); }
  return {t, burn, fl, F, num, adj:(l, n = 2) => V.outside ? l - n*t : l,   // adjustSize (n = sum of the edge widths)
          sub:(l, mm) => V.outside ? l - mm : l,   // adjustSize en mm
          spc:ch => edgeSpacing(F, ch)};
}

// ---- Flexible-wall boxes: plate outline (ops) + wall (segs) ----
// ops : ['f'|'e'|'latch', len] | ['c', deg, r] ; segs : ['F'|'X'|'e'|'L', len] (F = notches top+bottom, X = slits, L = latch)
function flexModel(c, s) {
  const {t, F} = c, L = s.latch, Hw = s.x + 2*t;
  const wallLen = s.segs.reduce((a, q) => a + q[1], 0);
  // smooth states (no fingers) at the start of each op
  const sm = turtle(s.start[0], s.start[1]), states = [], opLen = [];
  for (const o of s.ops) { states.push({x:sm.x, y:sm.y, hd:sm.hd});
    if (o[0] === 'c') { sm.corner(o[1], o[2]); opLen.push(o[2] ? Math.abs(o[1])*RAD*o[2] : 0); }
    else { sm.edge(o[1]); opLen.push(o[1]); } }
  // real plate outline
  const T = turtle(s.start[0], s.start[1]);
  for (const o of s.ops) { const [k, a, r] = o;
    if (k === 'f') T.fingers(a, true, F); else if (k === 'e') T.edge(a);
    else if (k === 'c') T.corner(a, r);
    else { T.corner(-90); T.edge(t); T.corner(90); T.edge(a/2); T.corner(90); T.edge(t); T.corner(-90); T.edge(a/2); } }   // latch positif
  T.pts.pop();
  // neutral line of the wall, curvature × (1-d): d=0 closed, d=1 flat along +x
  // only: index of one arc whose curvature alone is reduced (door that opens); otherwise the whole wall is unfolded
  const wallLine = (d, only) => {
    const q = states[s.wallStartOp], s0 = only === undefined ? 1 - d : 1;
    let x = q.x*s0, y = q.y*s0, hd = q.hd*s0, u = 0; const pts = [{u, x, y, hd}];
    for (let i = 0; u < wallLen - 1e-6 && i < 3*s.ops.length; i++) {
      const k = (s.wallStartOp + i) % s.ops.length, o = s.ops[k], fac = only === undefined || k === only ? 1 - d : 1;
      if (o[0] === 'c') {
        if (!o[2]) { hd += o[1]*RAD*fac; continue; }
        const len = Math.min(opLen[k], wallLen - u), n = Math.max(1, Math.ceil(len/2)), kk = Math.sign(o[1])*fac/o[2];
        for (let j = 0; j < n; j++) { const ds = len/n, da = kk*ds;
          if (Math.abs(da) < 1e-9) { x += Math.cos(hd)*ds; y += Math.sin(hd)*ds; }
          else { const R = 1/kk, cx = x - R*Math.sin(hd), cy = y + R*Math.cos(hd), co = Math.cos(da), si = Math.sin(da), dx = x-cx, dy = y-cy;
            x = cx + co*dx - si*dy; y = cy + si*dx + co*dy; }
          hd += da; u += ds; pts.push({u, x, y, hd}); }
      } else { const len = Math.min(o[1], wallLen - u); x += Math.cos(hd)*len; y += Math.sin(hd)*len; u += len; pts.push({u, x, y, hd}); }
    }
    return pts; };
  // door = last flexible arc of the wall before the latch: it unfolds when the box is opened
  let doorOp = -1;
  { let u = 0; for (let i = 0; u < wallLen - 1e-6 && i < 3*s.ops.length; i++) { const k = (s.wallStartOp + i) % s.ops.length, o = s.ops[k];
      if (o[0] === 'c') { if (o[2]) doorOp = k; u += opLen[k]; } else u += o[1]; } }
  // flat wall texture: transparent = cut-out
  const texture = () => {
    const H = Hw, k = Math.max(2, Math.min(12, 8192/wallLen, 4096/H));
    const cv = document.createElement('canvas'); cv.width = Math.ceil(wallLen*k); cv.height = Math.ceil(H*k);
    const ctx = cv.getContext('2d'); ctx.fillStyle = '#d9b27a'; ctx.fillRect(0, 0, cv.width, cv.height);
    const h = t + F.extra;
    // 1st pass: cut-outs drawn dark and slightly larger (= outline); 2nd pass: the same cut-outs, emptied
    const cuts = outline => {
      const pad = outline ? 1.3 : 0;
      ctx.globalCompositeOperation = outline ? 'source-over' : 'destination-out';
      ctx.fillStyle = ctx.strokeStyle = outline ? '#4a3418' : '#000';
      ctx.lineWidth = Math.max(0.3*k, 1.5) + 2*pad; ctx.lineCap = 'butt';
      const hole = (u, w, y0, y1) => ctx.fillRect(u*k - pad, (H-y1)*k - pad, w*k + 2*pad, (y1-y0)*k + 2*pad);
      let u0 = 0, fi = 0;
      for (const [kind, len] of s.segs) {
        if (kind === 'F') {
          for (const [o, f] of fingerLayout(len, false, F)) { hole(u0+o, f, 0, h); hole(u0+o, f, H-h, H); }
          for (const zc of (s.rowsZ || [])) for (const [o, f] of fingerLayout(len, true, F))   // reinforcement holes (fingers that go through the wall)
            if (!s.keepFinger || s.keepFinger(fi, o, f)) hole(u0+o-F.play/2, f+F.play, zc-(F.w+F.play)/2, zc+(F.w+F.play)/2);
          fi++;
        }
        else if (kind === 'L') { hole(u0, L/2 + 0.2*t, 0, 1.1*t); hole(u0, L/2 + 0.2*t, H-1.1*t, H); }
        else if (kind === 'X') for (const [u, segs] of flexLines(len, H, c.fl, c.burn)) for (const [y0, y1] of segs) {
          ctx.beginPath(); ctx.moveTo((u0+u)*k, (H-y0)*k); ctx.lineTo((u0+u)*k, (H-y1)*k); ctx.stroke(); }
        u0 += len;
      }
      for (const hh of (s.holes || [])) {   // extra holes in wall coordinates (u, z): circles {c:[u,z,r]} or rounded slots {r:[u,z,w,h,rad]}
        ctx.beginPath();
        if (hh.c) ctx.arc(hh.c[0]*k, (H-hh.c[1])*k, hh.c[2]*k + pad, 0, 2*Math.PI);
        else { const [u, z, w, hg, rd] = hh.r, x0 = (u-w/2)*k - pad, x1 = (u+w/2)*k + pad, y0 = (H-z-hg/2)*k - pad, y1 = (H-z+hg/2)*k + pad, q = rd*k;
          ctx.moveTo(x0+q, y0); ctx.arcTo(x1, y0, x1, y1, q); ctx.arcTo(x1, y1, x0, y1, q); ctx.arcTo(x0, y1, x0, y0, q); ctx.arcTo(x0, y0, x1, y0, q); ctx.closePath(); }
        ctx.fill();
      }
    };
    cuts(true); cuts(false);
    const tex = new THREE.CanvasTexture(cv); tex.anisotropy = 8; tex.generateMipmaps = false; tex.minFilter = THREE.LinearFilter;
    return tex; };
  const xs = T.pts.map(p => p[0]), ys = T.pts.map(p => p[1]);
  const bb = {minX:Math.min(...xs), maxX:Math.max(...xs), maxY:Math.max(...ys)};
  const wallAt = u => { const L = wallLine(0); let i = 1; while (i < L.length - 1 && L[i].u < u) i++;

// FlexEdge cuts (x = arc length, h) -> segments [y0,y1] per line (position u along the arc)
function flexLines(x, h, {dist, conn, width}, burn) {

  for (let i = 1; i < lines; i++) {
    const u = i*dist + left/2, seg = [];
    if (i % 2) {
      seg.push([0, conn+sh]);
      for (let j = 0; j < Math.floor((sections-1)/2); j++) seg.push([(2*j+1)*sh+(2*j+2)*conn, (2*j+3)*(sh+conn)]);
      if (!(sections % 2)) seg.push([h-sh-conn, h]);

      seg.push([h, h-conn-sh]);
      for (let j = 0; j < Math.floor((sections-1)/2); j++) seg.push([h-((2*j+1)*sh+(2*j+2)*conn), h-(2*j+3)*(sh+conn)]);
    } else for (let j = 0; j < sections/2; j++) seg.push([h-conn-2*j*(sh+conn), h-2*(j+1)*(sh+conn)]);
    out.push([u, seg]);

let M = null, parts = [], wallMeshes = [], wallMat = null;
function applyExplode() {

  for (const p of parts) { p.g.quaternion.identity(); p.g.position.copy(p.dir).multiplyScalar(e);

    const sl = document.querySelector('#explodeRow input'); if (sl) sl.value = e;
    const un = document.querySelector('#unfoldRow input'); if (un) un.value = 0;
    const opn = document.querySelector('#openRow input'); if (opn) opn.value = 0;
    if (k < 1) anim = requestAnimationFrame(step); else { V._explode = 0; applyExplode(); if (sl) sl.value = 0; }
  };
  anim = requestAnimationFrame(step);
}
// switch language: re-render every texts of the page
function setLang(l) {
  if (!(l in LANGS)) return;
  LANG = l; try { localStorage.setItem('boxes3d_lang', l); } catch (e) {}
  document.documentElement.lang = l.replace('_', '-'); labelViews();
  const homeOpen = !home.hidden; home.textContent = '';
  drawForm(); updateLink(); build();
  if (homeOpen) showHome();
}
// ---- Home page: one 3D thumbnail per type, rendered on first display then cached ----
const THUMB_VER = 'v4';
const FLEXCAT = k => SECTION[k] === 'flex';   // 'flexible hinge' section
const home = document.createElement('div'); home.id = 'home'; home.hidden = true; document.body.append(home);
let thumbsDone = false;
function openType(k) {
  TYPE = k; fitted = false; resetValues(); drawForm(); updateLink(); build(); assemble(); home.hidden = true;
}
function showHome() {
  cancelAnimationFrame(anim); home.hidden = false;
  if (home.firstChild) return;
  const types = TYPE_ORDER.filter(k => BUILD[k] && SCHEMAS[k]);
  home.innerHTML = '<h1></h1><small></small><br><input id="q" type="text">';
  home.querySelector('h1').textContent = tr('Boxes.py — 3D visualizer'); home.querySelector('small').textContent = tr('{0} box types. Pick one to see it assembled, exploded and fully configurable (same settings as the generator).', types.length);
  home.querySelector('#q').placeholder = tr('Search…'); home.prepend(langSelect()); home.firstChild.classList.add('homelang');
  const imgs = {}, cards = [];
  const section = (title, list) => {
    const h2 = document.createElement('h2'); h2.textContent = title + ' (' + list.length + ')'; home.append(h2);
    const g = document.createElement('div'); g.className = 'grid'; home.append(g);
    for (const k of list) {
      const c = document.createElement('div'); c.className = 'card'; c.onclick = () => openType(k);
      c.innerHTML = '<div class="im"><img alt=""></div><div class="tx"><b></b><small></small></div>';
      const lk = LS(k); c.querySelector('b').textContent = lk.title; c.querySelector('small').textContent = k + ' — ' + lk.desc;
      imgs[k] = c.querySelector('img'); c.dataset.s = (lk.title + ' ' + k + ' ' + lk.desc).toLowerCase(); g.append(c); cards.push(c);
    }
  };
  section(tr('Boxes'), types.filter(k => !FLEXCAT(k)));
  section(tr('Boxes with a flexible hinge'), types.filter(FLEXCAT));
  home.querySelector('#q').oninput = e => { const q = e.target.value.toLowerCase(); cards.forEach(c => c.style.display = c.dataset.s.includes(q) ? '' : 'none'); };
  // thumbnails: localStorage cache, otherwise rendered off-screen (240×180), one type per task
  const cache = (() => { try { return JSON.parse(localStorage.getItem('boxes3d_thumbs_' + THUMB_VER)) || {}; } catch (e) { return {}; } })();
  const todo = types.filter(k => cache[k] ? (imgs[k].src = cache[k], false) : true);
  const save = () => { try { localStorage.setItem('boxes3d_thumbs_' + THUMB_VER, JSON.stringify(cache)); } catch (e) {} };
  const step = () => {
    const k = todo.shift();
    if (!k) { save(); layout(); return; }
    try {
      TYPE = k; fitted = false; resetValues(); build(); fitted = false; recenter();   // recentre + frame the camera on the box
      renderer.setSize(240, 180); camera.aspect = 240/180; camera.updateProjectionMatrix();
      renderer.render(scene, camera);
      if (!step.warm) { step.warm = 1; todo.unshift(k); } else   // 1st render = warm-up (camera not framed yet), done again
      cache[k] = imgs[k].src = renderer.domElement.toDataURL('image/jpeg', 0.8);
    } catch (e) {}
    setTimeout(step, 0);
  };
  step();
}
// Deep links: #Type&lang=xx&mode=3d|split|2d&explode=40&unfold=1&open=0.5&ui=0&rotate=0&view=iso|top|front|side&p_<parameter>=value
const HASH = location.hash.slice(1).split('&'), HOPT = Object.fromEntries(HASH.slice(1).map(q => q.split('=')));
if (HOPT.lang in LANGS) { LANG = HOPT.lang; labelViews(); }
if (BUILD[HASH[0]]) {
  TYPE = HASH[0]; fitted = false; resetValues();
  for (const [k, v] of Object.entries(HOPT)) if (k.startsWith('p_')) { const n = k.slice(2); V[n] = typeof V[n] === 'boolean' ? (v === '1' || v === 'true') : decodeURIComponent(v); }
  const still = 'explode' in HOPT || 'unfold' in HOPT || 'open' in HOPT;
  if ('explode' in HOPT) V._explode = +HOPT.explode; if ('unfold' in HOPT) V._unfold = +HOPT.unfold; if ('open' in HOPT) V._open = +HOPT.open;
  drawForm(); updateLink(); build(); if (!still) assemble(); else applyExplode();
  if (HOPT.rotate === '0') { controls.autoRotate = false; const rl = ui.querySelector('.rotlabel input'); if (rl) rl.checked = false; }
  if (HOPT.ui === '0') ui.style.display = 'none';
  if (HOPT.mode) { MODE = HOPT.mode; refreshPlan(true); }
  if (HOPT.view) { const d = {iso:[.8,.6,1], top:[0,1,.001], front:[0,.2,1], side:[1,.2,0]}[HOPT.view]; if (d) { const n = Math.hypot(...d), r = camera.position.length(); camera.position.set(d[0]/n*r, d[1]/n*r, d[2]/n*r); controls.update(); } }
}   // #TypeName: opens a type directly
else { resetValues(); drawForm(); updateLink(); build(); showHome(); }
addEventListener('resize', layout);
layout();
(function loop(){ requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();
</script></body></html>
